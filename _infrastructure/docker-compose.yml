# =============================================================================
# Amelanq Netz-Anmeldung - Docker Compose (Base)
#
# HARTE REGEL: NUR na-nginx bekommt ein Host-Port-Mapping (ueber die
# Dev-Override). Alle anderen Services laufen NUR im internen Netz
# na-intranet.
#
# Start:
#   docker compose -f docker-compose.yml up -d                 # Produktion
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d  # Dev
#
# Prefix: na-  (Netz-Anmeldung)
# =============================================================================

services:

  # ===========================================
  # DATABASE - MongoDB
  # ===========================================
  na-mongodb:
    image: mongo:7.0
    container_name: 'na-mongodb'
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - ./mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - ./mongodb/volume:/data/db
    # 🔒 KEIN ports-Mapping - nur intern erreichbar
    networks:
      - na-intranet
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      options:
        max-size: "30m"
        max-file: "5"

  # ===========================================
  # CACHE / SESSIONS - Redis
  # ===========================================
  na-redis:
    image: redis:7.2-alpine
    container_name: 'na-redis'
    restart: unless-stopped
    command:
      - /usr/local/etc/redis/redis.conf
    volumes:
      - na-redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    # 🔒 KEIN ports-Mapping
    networks:
      - na-intranet
    logging:
      options:
        max-size: "30m"
        max-file: "5"

  # ===========================================
  # BLOB STORAGE - Silo (MinIO-Nachfolger, minio/minio ist eingestellt)
  # ===========================================
  na-minio:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    container_name: na-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-naadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-naadmin123}
    volumes:
      - ./minio/volume:/data
    # 🔒 KEIN ports-Mapping
    networks:
      - na-intranet
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 30s
      timeout: 10s
      start_period: 2m
      retries: 3
    logging:
      options:
        max-size: "30m"
        max-file: "5"

  # ===========================================
  # AUTH - Ory Kratos (Admin-Login)
  # ===========================================
  na-kratos-pgdb:
    image: postgres:16-alpine
    container_name: 'na-kratos-pgdb'
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${KRATOS_DB_USER}
      - POSTGRES_PASSWORD=${KRATOS_DB_PASSWORD}
      - POSTGRES_DB=${KRATOS_DB_NAME}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ./postgres/volume:/var/lib/postgresql/data
    # 🔒 KEIN ports-Mapping
    networks:
      - na-intranet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KRATOS_DB_USER} -d ${KRATOS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "30m"
        max-file: "5"

  # ==================== KRATOS-CONFIG-INIT (envsubst) ====================
  # Substituiert ${PUBLIC_BASE_URL} im Template -> kratos-config-substituted/kratos.yml
  # ====================
  na-kratos-config-init:
    image: alpine:3.20
    restart: "no"
    depends_on:
      na-kratos-pgdb:
        condition: service_healthy
    environment:
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8092}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache gettext >/dev/null 2>&1
        envsubst < /config/kratos.yml.template > /config-out/kratos.yml
        echo "kratos.yml substituiert (PUBLIC_BASE_URL=$$PUBLIC_BASE_URL)"
    volumes:
      - type: bind
        source: ./auth-kratos/kratos-config
        target: /config
      - type: bind
        source: ./auth-kratos/kratos-config-substituted
        target: /config-out
    networks:
      - na-intranet

  # ==================== EINMALIGER KRATOS-MIGRATIONSLAUF ====================
  # Legt die Kratos-Tabellen an (neu oder nach Upgrade). NICHT persistent.
  # Aufruf: docker compose run --rm na-kratos-migrate
  # Danach: docker compose up -d
  # =====================================================
  na-kratos-migrate:
    image: oryd/kratos:v1.1.0
    restart: "no"
    depends_on:
      na-kratos-pgdb:
        condition: service_healthy
    environment:
      - DSN=postgres://${KRATOS_DB_USER}:***}@na-kratos-pgdb:5432/${KRATOS_DB_NAME}?sslmode=disable
    entrypoint: ["kratos", "migrate", "sql", "postgres://${KRATOS_DB_USER}:***}@na-kratos-pgdb:5432/${KRATOS_DB_NAME}?sslmode=disable", "-c", "/etc/config/kratos/kratos.yml", "-y"]
    volumes:
      - type: bind
        source: ./auth-kratos/kratos-config
        target: /etc/config/kratos
    networks:
      - na-intranet

  na-kratos:
    image: oryd/kratos:v1.1.0
    container_name: 'na-kratos'
    restart: unless-stopped
    depends_on:
      na-kratos-pgdb:
        condition: service_healthy
    environment:
      - DSN=postgres://${KRATOS_DB_USER}:${KRATOS_DB_PASSWORD}@na-kratos-pgdb:5432/${KRATOS_DB_NAME}?sslmode=disable&max_conns=20&max_idle_conns=4
    command: serve -c /etc/config/kratos/kratos.yml
    volumes:
      # kratos.yml kommt aus dem substituierten Template (na-kratos-config-init)
      - type: bind
        source: ./auth-kratos/kratos-config-substituted/kratos.yml
        target: /etc/config/kratos/kratos.yml
      # Identity-Schemas direkt aus dem Repo
      - type: bind
        source: ./auth-kratos/kratos-config/identity.admin.schema.json
        target: /etc/config/kratos/identity.admin.schema.json
      - type: bind
        source: ./auth-kratos/kratos-config/identity.installer.schema.json
        target: /etc/config/kratos/identity.installer.schema.json
    # 🔒 KEIN ports-Mapping (4433/4434 intern)
    networks:
      - na-intranet
    logging:
      options:
        max-size: "30m"
        max-file: "5"

  # ===========================================
  # AUTH GATEWAY - Ory Oathkeeper (prueft Kratos-Session)
  # ===========================================
  na-oathkeeper:
    image: oryd/oathkeeper:v0.40.7
    container_name: 'na-oathkeeper'
    restart: unless-stopped
    depends_on:
      - na-kratos
    command: serve proxy -c /etc/config/oathkeeper/oathkeeper.yml
    environment:
      - LOG_LEVEL=${OATHKEEPER_LOG_LEVEL}
    volumes:
      - type: bind
        source: ./auth-oathkeeper/oathkeeper-config
        target: /etc/config/oathkeeper
    # 🔒 KEIN ports-Mapping (4455/4456 intern)
    networks:
      - na-intranet
    logging:
      options:
        max-size: "30m"
        max-file: "5"

  # ===========================================
  # MIGRATION (einmalig, vor Backend)
  # ===========================================
  na-migrate:
    image: na-backend
    container_name: 'na-migrate'
    restart: "no"
    depends_on:
      na-mongodb:
        condition: service_healthy
    environment:
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@na-mongodb:27017
      - MONGO_DATABASE=${MONGO_DATABASE}
      - TZ=${TZ}
    command: ["python", "-m", "src.migrate"]
    volumes:
      - ../backend/src:/app/src:ro
      - ../VERSION:/opt/app-version:ro
    networks:
      - na-intranet
    logging:
      options:
        max-size: "30m"
        max-file: "5"

  # ===========================================
  # BACKEND - FastAPI
  # ===========================================
  na-backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        INSTALL_DEV: "true"
    image: na-backend
    container_name: 'na-backend'
    restart: unless-stopped
    depends_on:
      na-mongodb:
        condition: service_healthy
      na-migrate:
        condition: service_completed_successfully
      na-netzportal:
        condition: service_healthy
      na-weasyprint:
        condition: service_started
      na-minio:
        condition: service_healthy
      na-kataster:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV}
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@na-mongodb:27017
      - MONGO_DATABASE=${MONGO_DATABASE}
      - TZ=${TZ}
      - NETZPORTAL_URL=http://na-netzportal:8080
      - NETZPORTAL_API_KEY=${NETZPORTAL_API_KEY:?Set NETZPORTAL_API_KEY}
      - NETZPORTAL_TIMEOUT_SECONDS=180
      - WEASYPRINT_URL=http://na-weasyprint:8012
      - KATASTER_URL=http://na-kataster:8765
      - KATASTER_TIMEOUT_SECONDS=${KATASTER_TIMEOUT_SECONDS:-300}
      - MINIO_ENDPOINT=na-minio:9000
      - MINIO_ACCESS_KEY=${MINIO_USER:-naadmin}
      - MINIO_SECRET_KEY=${MINIO_PASSWORD}
    volumes:
      # Dev: Quellcode bind-mounten, damit --reload greift.
      - ../backend/src:/app/src
    # 🔒 KEIN ports-Mapping - nur ueber nginx erreichbar
    networks:
      - na-intranet
      - na-kataster-private
      - na-netzportal-relay
    logging:
      options:
        max-size: "30m"
        max-file: "5"

  # ===========================================
  # FRONTEND - Vue SPA (nginx)
  # ===========================================
  na-frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: na-frontend
    container_name: 'na-frontend'
    restart: unless-stopped
    # 🔒 KEIN ports-Mapping - nur nginx
    networks:
      - na-intranet
    logging:
      options:
        max-size: "30m"
        max-file: "5"

  # ===========================================
  # 🌐 REVERSE PROXY - EINZIGER OEFFENTLICHER PORT
  # ===========================================
  na-nginx:
    image: nginx:1.27-alpine
    container_name: 'na-nginx'
    restart: unless-stopped
    depends_on:
      - na-backend
      - na-frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      # Reverse Proxy in Produktion: externer nginx-proxy + acme-companion
      # erkennt diesen Container ueber diese Variablen und uebernimmt TLS.
      # Im Dev bleiben sie leer (${VAR:-}) - ohne externen Proxy ohne Wirkung.
      # na-nginx lauscht auf Port 80 -> kein VIRTUAL_PORT noetig.
      VIRTUAL_HOST: ${VIRTUAL_HOST:-}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    # Produktion: KEIN Host-Port - der externe Proxy erreicht na-nginx ueber das
    #   gemeinsame Netz 'proxy'. TLS macht der Proxy.
    # Lokales Dev: docker-compose.dev.yml als Override nutzen.
    networks:
      - na-intranet
      - proxy
    logging:
      options:
        max-size: "30m"
        max-file: "5"

  # ===========================================
  # WEASYPRINT - PDF-Rendering fuer den Lageplan-Editor
  # ===========================================
  na-weasyprint:
    build:
      context: ..
      dockerfile: weasyprint/Dockerfile
    image: na-weasyprint
    container_name: 'na-weasyprint'
    restart: unless-stopped
    # 🔒 KEIN ports-Mapping - nur na-backend erreicht diesen Service
    networks:
      - na-intranet
    logging:
      options:
        max-size: "30m"
        max-file: "5"

  # ===========================================
  # KATASTER - Adresssuche, 60-m-Karte und Grundstuecksdaten
  # Nur das Backend hat Zugriff auf das private Service-Netz.
  # ===========================================
  na-kataster:
    build:
      context: ../kataster
      dockerfile: Dockerfile
    image: na-kataster
    container_name: na-kataster
    init: true
    restart: unless-stopped
    expose:
      - "8765"
    environment:
      - KATASTER_PHOTON_URL=${KATASTER_PHOTON_URL:-https://photon.komoot.io/api/}
      - KATASTER_BY_USER=${KATASTER_BY_USER:-}
      - KATASTER_BY_PASSWORD=${KATASTER_BY_PASSWORD:-}
    volumes:
      - na-kataster-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - na-kataster-private
      - na-kataster-egress
    logging:
      options:
        max-size: "30m"
        max-file: "5"

  # ===========================================
  # NETZPORTAL - separate Integration, kein nginx-Route
  # ===========================================
  na-netzportal:
    build:
      context: ../netzportal
    image: na-netzportal:0.4.0
    restart: unless-stopped
    env_file:
      - ./na-netzportal/.env
    environment:
      NETZPORTAL_API_KEY: ${NETZPORTAL_API_KEY:?Set NETZPORTAL_API_KEY}
      NRM_HOST: 0.0.0.0
      NRM_PORT: "8080"
      PV_DATA_DIR: /data
    volumes:
      - ./na-netzportal/volume:/data
    # 🔒 KEIN ports-Mapping - nur na-backend erreicht diesen Service
    networks:
      - na-netzportal-relay
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  na-intranet:
    driver: bridge
  na-kataster-private:
    driver: bridge
    internal: true
  na-kataster-egress:
    driver: bridge
  na-netzportal-relay:
    driver: bridge
  # Externes Netz des nginx-proxy (liegt auf dem Prod-Host bereits vor).
  proxy:
    external: true
    name: proxy

volumes:
  na-redis-data:
  na-kataster-data:

