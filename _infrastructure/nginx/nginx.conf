user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 8m;

    upstream backend {
        server na-backend:8000;
    }

    upstream frontend {
        server na-frontend:80;
    }

    # Oathkeeper prueft die Kratos-Session, bevor die Anfrage das Backend erreicht.
    upstream oathkeeper {
        server na-oathkeeper:4455;
    }

    # Kratos Public-API: Login-Formulare, Session-Abfrage, Logout.
    upstream kratos {
        server na-kratos:4433;
    }

    server {
        listen 80;
        server_name _;

        # --- Health ---
        location /healthz {
            proxy_pass http://backend/healthz;
            access_log off;
        }

        # --- Oeffentlich: Status-API (Landing-Seite) ---
        location /api/status {
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Logout: serverseitig den Kratos-Session-Cookie loeschen ---
        # Kratos v1.1 erlaubt es nicht, die eigene aktive Session per API
        # zu beenden (DELETE /sessions/{id} -> 400 "cannot revoke current
        # session", POST /sessions -> 405, Logout-Flow braucht Token aus der
        # offiziellen UI). Deshalb: hier wird der Cookie serverseitig mit
        # max-age=0 zurueckgesetzt (ersetzt den HttpOnly-Cookie im Browser),
        # danach Redirect zur Login-Seite.
        # Der Pfad ist /logout, nicht /admin/logout, weil der Installer
        # auch hierhin leitet. Das Frontend ruft /logout auf und wird
        # zur jeweiligen Login-Seite zurueckgeleitet.
        location = /logout {
            # CORS: Der Browser braucht diese Header, sonst blockt er die Anfrage.
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            # Set-Cookie mit Max-Age=0 loescht den HttpOnly-Cookie serverseitig.
            add_header Set-Cookie "ory_kratos_session=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax" always;
            # KEIN Redirect! Der Browser-Fetch folgt Redirects automatisch,
            # und die Zielseite (SPA) wuerde ohne CORS-Header antworten
            # -> "Failed to fetch" im Browser. Die Navigation macht die SPA
            # selbst (window.location.assign nach dem Logout).
            return 200 "";
        }

        # --- Kratos Self-Service (Login, Logout, Session) ---
        # Muss oeffentlich sein: hier meldet sich der Admin ueberhaupt erst an.
        location /kratos/ {
            proxy_pass http://kratos/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie            $http_cookie;
            # CORS: SPA braucht diese Header, sonst wird der Fetch abgewiesen
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        }

        # --- Verwaltung: NUR mit gueltiger Kratos-Session ---
        # Laeuft ueber Oathkeeper. Ohne Login kommt 401 zurueck.
        location /api/admin/ {
            proxy_pass http://oathkeeper;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie            $http_cookie;
        }

        # --- Installer: eigene Kunden/Anlagen (auth via Oathkeeper) ---
        location /api/installer/ {
            proxy_pass http://oathkeeper;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie            $http_cookie;
        }

        # --- Uebrige API (Docs, etc.) ---
        location /api/docs/ {
            proxy_pass http://oathkeeper;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie            $http_cookie;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Frontend (Vue SPA) ---
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
