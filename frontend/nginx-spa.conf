# Amelanq Netz-Anmeldung - Frontend (SPA)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-Routing: alle Pfade fallen auf index.html
    location / {
        # index.html darf NICHT gecacht werden - sonst bleibt der Browser
        # nach einem Frontend-Deploy beim alten Asset-Hash hängen und lädt
        # Login-Views, die der Server nicht mehr kennt (404/403 beim Login).
        # Verified am 21.10.2026: Kolya konnte in Inkognito/Firefox loginn,
        # im normalen Chrome-Profil nicht - trotz Hard Reload. Ursache: Chrome
        # hatte index.html (ohne Cache-Control: no-cache) aus dem Disk-Cache
        # geladen und referenzierte den alten index-Bundle (nicht mehr vorhanden).
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
