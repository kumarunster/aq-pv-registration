[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nrm-netzanmeldung"
version = "0.4.0"
description = "Multi-provider PV registration portal API"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "beautifulsoup4==4.15.0",
  "python-dotenv==1.2.4",
  "pycognito==2024.5.1",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[project.scripts]
nrm-api = "nrm_api.__main__:main"

[tool.setuptools.packages.find]
include = ["nrm_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
